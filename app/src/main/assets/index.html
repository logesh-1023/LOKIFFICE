<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LOKIFFCE AI</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --border: #23314d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #172554 0%, var(--bg) 60%);
      color: var(--text); display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(19, 28, 46, 0.95);
      border: 1px solid var(--border); border-radius: 20px; padding: 20px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.55); backdrop-filter: blur(12px);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.08em; background: linear-gradient(90deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.3);
    }
    .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--green); border-color: rgba(34,197,94,0.3); }
    
    /* AI Copilot Banner */
    .ai-banner {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px; padding: 10px 12px;
      margin-bottom: 14px; display: flex; align-items: flex-start; gap: 10px;
    }
    .ai-icon { font-size: 1rem; margin-top: 1px; }
    .ai-text { font-size: 0.75rem; color: #e2e8f0; line-height: 1.4; }
    .ai-text b { color: var(--accent); }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input[type="time"] {
      width: 100%; padding: 10px 14px; font-size: 1.2rem; font-weight: 700;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; outline: none;
    }
    .chips { display: flex; gap: 6px; margin-top: 8px; }
    .chip {
      flex: 1; padding: 6px 0; font-size: 0.73rem; font-weight: 600; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: pointer; text-align: center;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    
    .hero {
      margin-top: 12px; padding: 12px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(168, 85, 247, 0.1));
      border: 1px solid rgba(56, 189, 248, 0.3); text-align: center;
    }
    .hero span { display: block; font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hero strong { display: block; font-size: 1.8rem; margin-top: 2px; color: #fff; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; }
    .box small { display: block; font-size: 0.65rem; color: var(--muted); }
    .box b { display: block; font-size: 0.88rem; margin-top: 2px; }

    hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    
    .timer-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px; text-align: center; margin-bottom: 10px;
    }
    .countdown { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--green); }
    .status-text { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

    .transit-pill {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; margin-bottom: 10px; font-size: 0.75rem;
    }
    .transit-pill span { color: var(--muted); }
    .transit-pill b { color: var(--purple); }

    .adjust-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .adjust-row button { flex: 1; padding: 6px; font-size: 0.72rem; }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      padding: 9px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #090d16; border: none; font-weight: 700; }

    .streak-bar { display: flex; justify-content: space-between; gap: 6px; margin-top: 12px; }
    .day-pill {
      flex: 1; padding: 6px 0; text-align: center; border-radius: 8px; font-size: 0.68rem;
      font-weight: 700; background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    }
    .day-pill.done { background: rgba(34, 197, 94, 0.18); border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="brand">LOKIFFCE AI</div>
      <span id="gpsBadge" class="badge">AI Copilot Active</span>
    </div>

    <!-- AI Feature 1: OMR Traffic & Weather Copilot -->
    <div class="ai-banner" id="aiCopilotBanner">
      <div class="ai-icon">🤖</div>
      <div class="ai-text" id="aiCopilotText">Analyzing OMR traffic patterns & weather for Comcast shift...</div>
    </div>

    <label for="homeBy">When do you need to be back home?</label>
    <input type="time" id="homeBy" value="18:00" />
    <div class="chips">
      <div class="chip" onclick="setPreset('17:00', this)">5 PM</div>
      <div class="chip active" onclick="setPreset('18:00', this)">6 PM</div>
      <div class="chip" onclick="setPreset('19:00', this)">7 PM</div>
      <div class="chip" onclick="setPreset('20:00', this)">8 PM</div>
    </div>

    <div class="hero">
      <span>AI Recommended Leave Home At</span>
      <strong id="leaveHome">--:--</strong>
    </div>

    <div class="grid">
      <div class="box"><small>Office IN</small><b id="officeIn">--:--</b></div>
      <div class="box"><small>Office OUT</small><b id="officeOut">--:--</b></div>
      <div class="box"><small>Back Home</small><b id="backHome">--:--</b></div>
    </div>

    <hr />

    <!-- AI Feature 3: Smart Transit Advisor (Rapido / Metro) -->
    <div class="transit-pill">
      <span>Smart Transit Rec (Rapido / Metro):</span>
      <b id="transitRec">Calculating...</b>
    </div>

    <div class="timer-box">
      <div class="countdown" id="countdown">05:00:00</div>
      <div class="status-text" id="shiftInfo">Comcast 150m Geofence Active</div>
    </div>

    <div class="adjust-row">
      <button onclick="adjustIn(-15)">-15m IN</button>
      <button onclick="adjustIn(-5)">-5m IN</button>
      <button onclick="adjustIn(5)">+5m IN</button>
      <button onclick="resetShift()">Reset</button>
    </div>

    <div class="btn-row">
      <button class="primary" onclick="manualLogin()">Log IN Now</button>
      <button onclick="requestGPS()">Sync GPS</button>
    </div>

    <!-- AI Feature 4: Weekly Flow & Pattern Analyzer Bar -->
    <div class="streak-bar" id="streakBar"></div>
  </div>

  <script>
    const OFFICE_LAT = 12.947238;
    const OFFICE_LNG = 80.229203;
    const RADIUS_M = 150;
    const SHIFT_MS = 5 * 60 * 60 * 1000;
    const todayKey = () => "lokiffce_in_" + new Date().toISOString().slice(0, 10);

    const homeInput = document.getElementById("homeBy");
    function format12(date) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function setPreset(val, el) {
      homeInput.value = val;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");
      updatePlanner();
    }

    function runAICopilot() {
      const now = new Date();
      const hour = now.getHours();
      const bannerText = document.getElementById("aiCopilotText");
      const transitRec = document.getElementById("transitRec");

      // AI Feature 1: OMR Traffic Heuristics
      if (hour < 10) {
        bannerText.innerHTML = "<b>OMR Morning Flow:</b> Moderate traffic near Perungudi. Leaving on time keeps you right on target.";
      } else if (hour >= 17 && hour <= 20) {
        bannerText.innerHTML = "<b>Evening Peak Alert:</b> OMR return traffic is peaking. <b>Rapido Bike Taxi</b> recommended for faster lane filtering.";
      } else {
        bannerText.innerHTML = "<b>AI Status:</b> OMR route is clear. 5-hour shift timer synced with standard transit buffers.";
      }

      // AI Feature 3: Smart Transit Rec
      if (hour < 11) {
        transitRec.textContent = "🚇 Chennai Metro Rail recommended (Smooth morning schedule)";
      } else {
        transitRec.textContent = "🏍️ Rapido Bike Taxi recommended (Best for weaving past evening congestion)";
      }
    }

    function updatePlanner() {
      const [h, m] = homeInput.value.split(":").map(Number);
      if (isNaN(h)) return;
      const back = new Date();
      back.setHours(h, m, 0, 0);
      const out = new Date(back.getTime() - 3600000);
      const inn = new Date(out.getTime() - SHIFT_MS);
      const leave = new Date(inn.getTime() - 3600000);

      document.getElementById("leaveHome").textContent = format12(leave);
      document.getElementById("officeIn").textContent = format12(inn);
      document.getElementById("officeOut").textContent = format12(out);
      document.getElementById("backHome").textContent = format12(back);
    }
    homeInput.addEventListener("input", updatePlanner);
    updatePlanner();
    runAICopilot();

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function startShift(ts) {
      if (!localStorage.getItem(todayKey())) {
        localStorage.setItem(todayKey(), String(ts));
        renderStreak();
      }
    }

    function manualLogin() {
      startShift(Date.now());
    }

    function adjustIn(mins) {
      const saved = localStorage.getItem(todayKey());
      const base = saved ? Number(saved) : Date.now();
      localStorage.setItem(todayKey(), String(base + mins * 60000));
      renderStreak();
    }

    function resetShift() {
      localStorage.removeItem(todayKey());
      document.getElementById("countdown").textContent = "05:00:00";
      document.getElementById("shiftInfo").textContent = "Shift reset. Waiting for arrival.";
      renderStreak();
    }

    function requestGPS() {
      const badge = document.getElementById("gpsBadge");
      if (!("geolocation" in navigator)) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const dist = Math.round(getDistanceMeters(
            pos.coords.latitude, pos.coords.longitude, OFFICE_LAT, OFFICE_LNG
          ));
          if (dist <= RADIUS_M) {
            badge.textContent = "At Comcast (" + dist + "m)";
            badge.className = "badge ok";
            startShift(Date.now());
          } else {
            badge.textContent = dist + "m from Office";
            badge.className = "badge warn";
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
      );
    }

    function renderStreak() {
      const bar = document.getElementById("streakBar");
      bar.innerHTML = "";
      const labels = ["M", "T", "W", "T", "F", "S", "S"];
      const now = new Date();
      const day = (now.getDay() + 6) % 7;
      let completedCount = 0;
      
      for (let i = 0; i < 7; i++) {
        const d = new Date(now);
        d.setDate(now.getDate() - (day - i));
        const key = "lokiffce_in_" + d.toISOString().slice(0, 10);
        if (localStorage.getItem(key)) completedCount++;
        
        const div = document.createElement("div");
        div.className = "day-pill" + (localStorage.getItem(key) ? " done" : "");
        div.textContent = labels[i];
        bar.appendChild(div);
      }

      // AI Feature 4: Weekly Flow Pattern summary update
      if (completedCount >= 4) {
        document.getElementById("aiCopilotText").innerHTML = `<b>AI Weekly Flow:</b> Exceptional consistency (${completedCount}/5 days). Your OMR transit timing is locked in!`;
      }
    }

    setInterval(() => {
      const saved = localStorage.getItem(todayKey());
      if (!saved) return;
      const inTime = Number(saved);
      const outTime = saved ? inTime + SHIFT_MS : 0;
      const homeTime = outTime + 3600000;
      const rem = outTime - Date.now();

      document.getElementById("shiftInfo").textContent =
        "IN: " + format12(new Date(inTime)) + " • OUT: " + format12(new Date(outTime)) + " • Home: " + format12(new Date(homeTime));

      if (rem <= 0) {
        document.getElementById("countdown").textContent = "00:00:00";
      } else {
        const hrs = String(Math.floor(rem / 3600000)).padStart(2, "0");
        const mins = String(Math.floor((rem % 3600000) / 60000)).padStart(2, "0");
        const secs = String(Math.floor((rem % 60000) / 1000)).padStart(2, "0");
        document.getElementById("countdown").textContent = hrs + ":" + mins + ":" + secs;
      }
    }, 1000);

    renderStreak();
    requestGPS();
  </script>
</body>
</html>
